<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Amazon Homepage Clone</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ===== Top navigation bar: full-width dark strip, logo + search box + right group ===== -->
  <div class="nav-belt">
    <div class="nav-belt-inner">

      <a class="nav-logo" href="#">amazon</a>

      <div class="nav-location">
        <span class="line1">Deliver to</span>
        <span class="line2">Hong Kong</span>
      </div>

      <div class="nav-search">
        <div class="search-cate">All</div>
        <input class="search-input" type="text" placeholder="Search Amazon">
        <div class="search-btn">Q</div>
      </div>

      <div class="nav-right">
        <div class="nav-item nav-lang">EN</div>
        <div class="nav-item nav-account">
          <span class="line1">Hello, sign in</span>
          <span class="line2">Account &amp; Lists</span>
        </div>
        <div class="nav-item nav-order">
          <span class="line1">Returns</span>
          <span class="line2">&amp; Orders</span>
        </div>
        <div class="nav-cart">Cart</div>
      </div>

    </div>
  </div>
  <!-- ===== /Top navigation bar ===== -->

  <!-- ===== Secondary nav: full-width lighter dark bar with category links ===== -->
  <div class="nav-main">
    <div class="nav-main-inner">
      <div class="sub-item">☰ All</div>
      <div class="sub-item">Amazon Bazaar</div>
      <div class="sub-item">Prime Video</div>
      <div class="sub-item">Coupons</div>
      <div class="sub-item">Customer Service</div>
      <div class="sub-item">Today's Deals</div>
      <div class="sub-item">Registry</div>
      <div class="sub-item">Gift Cards</div>
      <div class="sub-item">Sell</div>
      <div class="clear"></div>
    </div>
  </div>
  <!-- ===== /Secondary nav ===== -->

  <!-- ===== Promo banner row: five clickable banner images, fixed-width centered ===== -->
  <div class="banner-row">
    <a class="banner-card" href="#">
      <img src="img/banner1.jpg" alt="Beyblade X toys">
    </a>
    <a class="banner-card" href="#">
      <img src="img/banner2.jpg" alt="Free international delivery">
    </a>
    <a class="banner-card" href="#">
      <img src="img/banner3.jpg" alt="kindle">
    </a>
    <a class="banner-card" href="#">
      <img src="img/banner4.jpg" alt="Prime Video">
    </a>
    <a class="banner-card" href="#">
      <img src="img/banner5.jpg" alt="Crazy low prices">
    </a>
    <div class="clear"></div>
  </div>
  <!-- ===== /Promo banner row ===== -->




</body>

</html>
